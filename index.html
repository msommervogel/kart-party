<style>

<script>
const $=s=>document.querySelector(s),RC=(location.hash.match(/r=(\w+)/)||[])[1],PAD=RC||matchMedia('(pointer:coarse)').matches;

const CH=[
{n:'Hippo',e:'🦛',mk(){const g=new THREE.Group(),E=[sp(.24,'#8f80dd',-.55,1.75,0),sp(.24,'#8f80dd',.55,1.75,0)];g.add(sp(.9,'#a99bf0',0,.9,-.1,1,.9,1.1),sp(.55,'#f7a8cf',0,.8,.85,1.3,.85,.9),sp(.09,'#5b3b7a',-.22,1,1.35),sp(.09,'#5b3b7a',.22,1,1.35),sp(.19,'#fff',-.38,1.4,.5),sp(.19,'#fff',.38,1.4,.5),sp(.09,'#111',-.38,1.42,.66),sp(.09,'#111',.38,1.42,.66),...E);g.anim=t=>E.forEach((e,i)=>e.rotation.z=Math.sin(t*9+i*2)*.5);return g}},
{n:'Abeille',e:'🐝',mk(){const g=new THREE.Group(),W=[sp(.6,'#9be7ff',-.85,1.7,-.2,.12,.5,.9),sp(.6,'#ffb3f0',.85,1.7,-.2,.12,.5,.9)];W.forEach(w=>{w.material.transparent=true;w.material.opacity=.75});g.add(sp(.75,'#ffd23f',0,.95,-.1,.9,.85,1.3),sp(.77,'#ff5fa2',0,.95,-.55,.93,.87,.16),sp(.77,'#5b8cff',0,.95,-.15,.93,.87,.16),sp(.76,'#2ee6a6',0,.95,.3,.93,.86,.16),sp(.5,'#ffd23f',0,1.25,1),sp(.13,'#111',-.22,1.38,1.42),sp(.13,'#111',.22,1.38,1.42),sp(.09,'#ff5fa2',-.28,2,1.1),sp(.09,'#ff5fa2',.28,2,1.1),...W);g.anim=t=>{W[0].rotation.z=.4+Math.sin(t*45)*.5;W[1].rotation.z=-W[0].rotation.z};return g}},
{n:'Grenouille',e:'🐸',mk(){const g=new THREE.Group(),Y=[sp(.34,'#5ed16a',-.42,1.6,.45),sp(.34,'#5ed16a',.42,1.6,.45)];g.add(sp(.85,'#5ed16a',0,.85,0,1.05,.8,1.15),sp(.55,'#c7f7a8',0,.6,.65,1.1,.6,.8),sp(.22,'#fff',-.42,1.72,.62),sp(.22,'#fff',.42,1.72,.62),sp(.1,'#111',-.42,1.74,.8),sp(.1,'#111',.42,1.74,.8),sp(.5,'#ff7a98',0,.75,1,1.1,.22,.4),...Y);g.anim=t=>Y.forEach((y,i)=>y.scale.y=1+Math.sin(t*6+i)*.1);return g}},
{n:'Renard',e:'🦊',mk(){const g=new THREE.Group(),T=new THREE.Group();T.position.set(0,.9,-1);T.add(sp(.35,'#ff8a3d',0,0,-.3,1,1,1.8),sp(.22,'#fff',0,0,-.95));g.add(T,sp(.8,'#ff8a3d',0,.9,-.1,1,.85,1.1),sp(.6,'#ff8a3d',0,1.25,.7),sp(.3,'#fff',0,1.08,1.25,1,.7,1.1),sp(.09,'#111',0,1.15,1.55),sp(.1,'#111',-.28,1.42,1.15),sp(.1,'#111',.28,1.42,1.15),cn(.24,.7,'#ff8a3d',-.38,1.95,.6),cn(.24,.7,'#ff8a3d',.38,1.95,.6));g.anim=t=>T.rotation.y=Math.sin(t*8)*.5;return g}}];
async function conn(code){try{const r=await window.claude.use('room');return r?await r.join('kp-'+code.toLowerCase()):null}catch(e){return null}}
/* ---------- MANETTE (téléphone) ---------- */
function pad(){
 let room,me={c:0,k:1,r:0,s:0,u:0},host,myp,prev,pev=-1;const dir={L:0,R:0};
 const P=o=>{Object.assign(me,o);room&&room.presence(o).catch(()=>{})},vib=p=>navigator.vibrate&&navigator.vibrate(p);
 const mk=(box,arr,key)=>arr.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<i>${c.e}</i>${c.n}`;b.onclick=()=>{P({[key]:i});sel();vib(15)};box.append(b)});
 mk($('#cg'),CH,'c');mk($('#kg'),KT,'k');
 function sel(){[...$('#cg').children].forEach((b,i)=>b.classList.toggle('on',i==me.c));[...$('#kg').children].forEach((b,i)=>b.classList.toggle('on',i==me.k));$('#rdy').classList.toggle('on',!!me.r);$('#rdy').textContent=me.r?'✅ PRÊT ! (annuler)':'PRÊT !'}
 sel();$('#rdy').onclick=()=>{P({r:me.r?0:1});sel();vib(40)};
 const sd=()=>{const s=dir.R-dir.L;s!==me.s&&P({s})};
 [['L'],['R']].forEach(([v])=>{const e=$('#'+v);e.onpointerdown=x=>{x.preventDefault();dir[v]=1;sd()};e.onpointerup=e.onpointercancel=e.onpointerleave=()=>{dir[v]=0;sd()}});
 $('#it').onpointerdown=e=>{e.preventDefault();P({u:me.u+1});vib(25)};
 function view(){const hp=host&&host.presence,ph=hp&&hp.ph,st=hp&&hp.st&&hp.st[myp];
  $('#st').textContent=!hp?'En attente de l’écran de jeu…':(ph=='lobby'||st?'':'Course en cours… tu joues à la prochaine manche !');
  if(ph=='lobby'&&prev!='lobby'){me.r=0;me.s=0;P({r:0,s:0});sel()}prev=ph;
  $('#sel').style.display=ph=='lobby'?'block':'none';$('#ctl').style.display=st&&ph!='lobby'?'block':'none';
  if(st&&ph!='lobby'){const[rk,lap,it,ev,et,fin]=st;$('#hd').textContent=ph=='end'||fin?`🏁 ${['🥇','🥈','🥉'][rk-1]||rk+'e'}`:`${rk==1?'🥇 1er':rk+'e'} · Tour ${lap}`;$('#it').textContent=it;$('#it').classList.toggle('has',!!it&&it!='❓');if(ev!==pev){pev=ev;vib(et?[90,40,90]:30)}}}
 async function join(code){$('#cd').style.display='none';$('#st').textContent='Connexion…';room=await conn(code);if(!room){$('#st').textContent='Connexion impossible : ouvre le lien partagé de l’artefact (compte requis).';return}
  room.presence({role:1,c:0,k:1,r:0,s:0,u:0}).catch(()=>{});room.onPeers(ch=>{host=ch.peers.find(p=>p.presence.host);myp=(ch.peers.find(p=>p.isMe&&p.sameTab)||{}).peer;view()})}
 if(RC)join(RC);else{$('#cd').style.display='block';$('#go').onclick=()=>$('#ci').value.trim().length>=3&&join($('#ci').value.trim())}
}
/* ---------- ÉCRAN DE JEU ---------- */
function host(){
const LAPS=4,N=400,W=9,CODE=Math.random().toString(36).slice(2,6);
/* tweens */
const TW=[],E={lin:t=>t,oq:t=>1-(1-t)*(1-t),oe:t=>t==0||t==1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2.094)+1};
function tw(o,p,d,e='oq',cb,dl=0){const f={};for(const k in p)f[k]=o[k];TW.push({o,p,f,d,e:E[e],cb,t:-dl})}
function stepTW(dt){for(let i=TW.length-1;i>=0;i--){const w=TW[i];w.t+=dt;if(w.t<0)continue;const u=Math.min(1,w.t/w.d),v=w.e(u);for(const k in w.p)w.o[k]=w.f[k]+(w.p[k]-w.f[k])*v;if(u>=1){TW.splice(i,1);w.cb&&w.cb()}}}
const pop=g=>{g.scale.setScalar(.01);tw(g.scale,{x:1,y:1,z:1},650,'oe')};
/* son */
let AC;onclick=onkeydown=()=>{AC=AC||new AudioContext();AC.resume()};
function sfx(f,d=.15,t='square',s=0,v=.06){try{const a=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,a);o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),a+d);g.gain.setValueAtTime(v,a);g.gain.exponentialRampToValueAtTime(.001,a+d);o.connect(g).connect(AC.destination);o.start();o.stop(a+d)}catch(e){}}
/* scène */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#8fd8ff');const cam=new THREE.PerspectiveCamera(38,1,1,500);let bp=[0,95,40];
function rs(){R.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,f=Math.max(1,1.35/a);cam.aspect=a;bp=[0,95*f,40*f];cam.position.set(...bp);cam.lookAt(0,0,2);cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
sc.add(new THREE.HemisphereLight('#fff','#8ab66a',.95));const dl=new THREE.DirectionalLight('#fff',.6);dl.position.set(20,40,15);sc.add(dl);
/* circuit */
const S=new THREE.CatmullRomCurve3([[-30,-10],[-20,-24],[0,-26],[18,-18],[30,-4],[24,12],[8,10],[0,22],[-16,26],[-32,16]].map(a=>new THREE.Vector3(a[0],0,a[1])),true,'centripetal').getSpacedPoints(N).slice(0,N);
const T=S.map((p,i)=>{const q=S[(i+1)%N];return new THREE.Vector3(q.x-p.x,0,q.z-p.z).normalize()});
function near(x,z,n,r){let b=1e9,bi=n;for(let d=-r;d<=r;d++){const j=(n+d+N)%N,dx=S[j].x-x,dz=S[j].z-z,q=dx*dx+dz*dz;if(q<b){b=q;bi=j}}return[bi,b]}
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t}
const gt=cvs(64,64,x=>{x.fillStyle='#7bd66b';x.fillRect(0,0,64,64);x.fillStyle='#6cc95f';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32)});gt.repeat.set(20,20);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({map:gt}));gr.rotation.x=-Math.PI/2;sc.add(gr);
function rib(w,y,f){const p=[],c=[];for(let i=0;i<N;i++){const j=(i+1)%N,a=S[i],b=S[j],ta=T[i],tb=T[j],col=new THREE.Color(f(i)),v=(P,t,s)=>[P.x-t.z*w*s,y,P.z+t.x*w*s];p.push(...v(a,ta,1),...v(a,ta,-1),...v(b,tb,1),...v(a,ta,-1),...v(b,tb,-1),...v(b,tb,1));for(let q=0;q<6;q++)c.push(col.r,col.g,col.b)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));sc.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})))}
rib(W/2+1.2,.02,i=>(i>>2)%2?'#ff3d5a':'#fff');rib(W/2,.04,()=>'#4a4e69');rib(.12,.06,i=>(i>>2)%2?'#fff':'#4a4e69');
const fl=new THREE.Group(),ft=cvs(8,2,x=>{for(let i=0;i<8;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?'#fff':'#111';x.fillRect(i,j,1,1)}});const fm=new THREE.Mesh(new THREE.PlaneGeometry(W,1.6),new THREE.MeshBasicMaterial({map:ft}));fm.rotation.x=-Math.PI/2;fm.position.y=.08;fl.add(fm);fl.position.copy(S[0]);fl.rotation.y=Math.atan2(T[0].x,T[0].z);sc.add(fl);
const TR=[];for(let i=0,n=0;i<300&&n<48;i++){const x=(Math.random()-.5)*120,z=(Math.random()-.5)*84;if(near(x,z,0,N/2)[1]<(W+5)**2&&S.some(p=>(p.x-x)**2+(p.z-z)**2<(W+5)**2))continue;n++;const g=new THREE.Group(),s=.8+Math.random()*.7,c=Math.random()<.5?'#3aa655':'#2f9e6b';const t=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,1.6,8),MAT('#8a5a3c'));t.position.y=.8;const a=new THREE.Mesh(new THREE.ConeGeometry(1.7,2.6,8),MAT(c)),b=new THREE.Mesh(new THREE.ConeGeometry(1.3,2.2,8),MAT(c));a.position.y=2.6;b.position.y=4;g.add(t,a,b);g.position.set(x,0,z);g.scale.setScalar(s);sc.add(g);pop(g);TR.push(g)}
/* karts */
function mkKart(ci,ki,col){const g=new THREE.Group(),b=new THREE.Group(),L=[3.8,3.3,2.9][ki];g.add(b);b.add(bx(2.3,.55,L,col,0,.5,0),bx(2.5,.3,.5,'#fff',0,.6,L/2),bx(1.4,.3,.9,'#222',0,.85,-L/2+.5));
[[-1.25,1],[1.25,1],[-1.25,-1],[1.25,-1]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.5,12),MAT('#222'));w.rotation.z=Math.PI/2;w.position.set(x,.5,z*L*.3);b.add(w)});
if(ki==0)b.add(bx(2.6,.12,.6,col,0,1.5,-L/2),bx(.12,.7,.12,'#222',-.8,1.15,-L/2),bx(.12,.7,.12,'#222',.8,1.15,-L/2));if(ki==2)b.add(bx(2.7,.5,.5,'#222',0,.5,L/2+.1));
const c=CH[ci].mk();c.position.y=.7;b.add(c);const sh=new THREE.Mesh(new THREE.CircleGeometry(2,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28}));sh.rotation.x=-Math.PI/2;sh.position.y=.1;sh.scale.set(1,1.5,1);g.add(sh);
const bub=sp(2.7,'#7fdcff',0,1.2,0);bub.material.transparent=true;bub.material.opacity=.35;bub.visible=false;g.add(bub);g.userData={b,c,bub};return g}
/* état */
const PL={},BX=[];let bots=[],all=[],HZ=[],PJ=[],PT=[],ph='lobby',room,tm=0,shake=0,order=0,tFirst=0,rdyT=0,hudT=0,lz=1;const BG={s:0,o:0},FL={o:0};
const ks=()=>Object.values(PL).concat(bots),nm=k=>k.hu?'J'+(k.slot+1):'Bot',wr=a=>Math.atan2(Math.sin(a),Math.cos(a));
function newK(id,slot,hu,c,kk,col){const k={id,slot,hu,col:col||COL[slot%8],c,k:kk,r:0,x:0,z:0,h:0,n:0,lap:0,sp:0,st:0,boost:0,spin:0,shield:0,slow:0,bc:0,item:null,ev:0,et:0,sq:0,hop:0,sr:0,fin:0,rk:1,s:0,uc:0};k.g=mkKart(c,kk,k.col);sc.add(k.g);pop(k.g);return k}
function place(k,i){const r=i>>1,ci=(N-10-r*9+N)%N,o=(i&1?1:-1)*2.3;k.x=S[ci].x-T[ci].z*o;k.z=S[ci].z+T[ci].x*o;k.h=Math.atan2(T[ci].x,T[ci].z);k.n=ci;k.lap=0;k.sp=0;k.st=0}
function rb(k){sc.remove(k.g);k.g=mkKart(k.c,k.k,k.col);sc.add(k.g);pop(k.g);conf(k.x,k.z);sfx(500,.12,'triangle',300)}
function hop(k){tw(k,{hop:2.4},170,'oq',()=>tw(k,{hop:0},600,'oe'));burst(k.x,k.z,k.col,10);sfx(700,.12,'square',400)}
/* particules */
const pg=new THREE.BoxGeometry(.5,.5,.5),pm={};
function burst(x,z,col,n=10,v=9,up=8,y=1){for(let i=0;i<n&&PT.length<350;i++){const m=new THREE.Mesh(pg,pm[col]||(pm[col]=new THREE.MeshBasicMaterial({color:col}))),a=Math.random()*6.28,s=Math.random()*v;m.position.set(x,y,z);m.userData={vx:Math.cos(a)*s,vy:Math.random()*up,vz:Math.sin(a)*s,l:.6+Math.random()*.5};sc.add(m);PT.push(m)}}
const conf=(x,z)=>COL.forEach(c=>burst(x,z,c,4,12,14,2));
/* pistes d'items */
[40,140,240,340].forEach((ci,q)=>[-2.7,0,2.7].forEach((o,j)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6),new THREE.MeshLambertMaterial({color:'#fff'}));const x=S[ci].x-T[ci].z*o,z=S[ci].z+T[ci].x*o;m.position.set(x,1.6,z);sc.add(m);BX.push({m,x,z,on:1,i:q*3+j})}));

const ev=(k,t)=>{k.ev++;k.et=t},sq=(k,a=.5)=>tw(k,{sq:a},120,'oq',()=>tw(k,{sq:0},500,'oe')),flash=()=>{FL.o=.85;tw(FL,{o:0},450)};

 k.spin=1.2;k.sp*=.25;k.sr=0;tw(k,{sr:Math.PI*4},1150,'oq',()=>k.sr=0);sq(k,-.35);burst(k.x,k.z,'#ffe03f',16,10,12,1.5);burst(k.x,k.z,'#fff',8,6,8,1.5);sfx(160,.35,'sawtooth',-120,.1);shake=Math.max(shake,.9);ev(k,1)}
function useItem(k){const it=k.item;if(!it||it=='?'||ph!='race')return;k.item=null;ev(k,0);

 else if(it=='banana'){const m=new THREE.Mesh(new THREE.TorusGeometry(.7,.28,8,14,4),MAT('#ffe03f'));m.rotation.x=-Math.PI/2;const x=k.x-Math.sin(k.h)*2.8,z=k.z-Math.cos(k.h)*2.8;m.position.set(x,.5,z);sc.add(m);pop(m);HZ.push({m,o:k,t:0,x,z});sfx(400,.15,'triangle',-200)}
 else if(it=='missile'){const m=new THREE.Group();m.add(sp(.55,'#ff3b3b',0,0,0,1,1,1.8),sp(.3,'#fff',0,0,1.1));m.position.set(k.x,1,k.z);sc.add(m);pop(m);PJ.push({m,x:k.x+Math.sin(k.h)*2.5,z:k.z+Math.cos(k.h)*2.5,h:k.h,o:k,life:6,n:k.n});sfx(900,.3,'sawtooth',-600)}

 else{ks().forEach(o=>{if(o!==k&&!o.fin){o.slow=3;sq(o,-.4);burst(o.x,o.z,'#fff35c',12,8,12,1.5)}});flash();shake=1.4;sfx(1400,.5,'sawtooth',-1200,.1)}}
function finish(k){k.fin=++order;tFirst=tFirst||tm;conf(k.x,k.z);sfx(900,.5,'triangle',700);ev(k,0)}
/* IA */
function ai(k){const la=(k.n+16+(k.hu?4:0))%N,t=S[la],o=k.lane||0;let d=wr(Math.atan2(t.x-T[la].z*o-k.x,t.z+T[la].x*o-k.z)-k.h);k.s=Math.max(-1,Math.min(1,-d*2.5));if(k.item&&k.item!='?'&&ph=='race'&&Math.random()<.012)useItem(k)}
/* physique */
function upd(k,dt){const T0=KT[k.k];if(k.ai||k.auto||k.fin)ai(k);for(const t of['boost','spin','shield','slow','bc'])if(k[t]>0)k[t]-=dt;

 if(k.n>N*.75&&bi<N*.25){k.lap++;if(k.lap>LAPS&&!k.fin)finish(k);else if(k.hu&&k.lap>1)sfx(700,.15,'square',300)}else if(k.n<N*.25&&bi>N*.75)k.lap--;

 k.sp+=(mx-k.sp)*Math.min(1,dt*(k.boost>0?5:1.5*T0.ac));k.h-=k.st*2.6*T0.tn*Math.min(1,.25+k.sp/12)*dt;
 k.x+=Math.sin(k.h)*k.sp*dt;k.z+=Math.cos(k.h)*k.sp*dt;
 if(b>225){const s=S[bi];k.x+=(s.x-k.x)*dt*2;k.z+=(s.z-k.z)*dt*2;k.sp*=.98}
 if(k.boost>0&&Math.random()<.7)burst(k.x-Math.sin(k.h)*2,k.z-Math.cos(k.h)*2,Math.random()<.5?'#ff9f1c':'#ffe066',1,3,2,.6);
 if(off&&k.sp>7&&Math.random()<.4)burst(k.x,k.z,'#8b6b3d',1,3,3,.4);
 if(k.spin>0&&Math.random()<.3)burst(k.x,k.z,'#ffe03f',1,5,6,2.6)}
function rankAll(){ks().sort((a,c)=>(a.fin?a.fin-1e3:-(a.lap*N+a.n))-(c.fin?c.fin-1e3:-(c.lap*N+c.n))).forEach((k,i)=>k.rk=i+1)}
function chips(){const a=ph=='lobby'?Object.values(PL):all.slice().sort((x,y)=>x.rk-y.rk);$('#pl').innerHTML=a.map(k=>`<div class="chip" style="border-color:${k.col}">${ph=='lobby'?'':k.rk+'. '}${CH[k.c].e} ${nm(k)} ${ph=='lobby'?(k.r?'✅':'…'):(k.item?(k.item=='?'?'❓':IT[k.item].e):'')}${k.fin?'🏁':''}</div>`).join('');
 $('#tt').textContent=ph=='lobby'?(room?'Tous prêts → départ automatique · Entrée : jouer au clavier (←→, ↑ perso, ↓ kart, Espace = prêt)':'Multijoueur indisponible ici · Entrée : jouer au clavier (←→ + Espace)'):ph=='race'?`Tour ${Math.min(LAPS,Math.max(1,Math.max(...all.map(k=>k.lap))))}/${LAPS}`:''}
function hs(){room&&room.presence({host:1,ph,st:Object.fromEntries(ks().filter(k=>k.hu&&k.id&&k.id!='kb').map(k=>[k.id,[k.rk,Math.min(LAPS,Math.max(1,k.lap)),k.item?(k.item=='?'?'❓':IT[k.item].e):'',k.ev,k.et,k.fin]]))}).catch(()=>{})}
/* flux de jeu */
function big(t){$('#big').textContent=t;BG.s=0;BG.o=1;tw(BG,{s:1},500,'oe');tw(BG,{o:0},300,'lin',0,700)}
function start(){if(ph!='lobby'||!Object.keys(PL).length)return;ph='count';$('#qr').style.display='none';bots=[];const h=Object.values(PL).length;
 for(let i=h;i<4;i++){const b=newK('bot'+i,i,0,Math.random()*4|0,Math.random()*3|0,COL.find(c=>!ks().some(k=>k.col==c)));b.ai=1;b.lane=(Math.random()-.5)*5;bots.push(b)}
 all=ks();all.forEach((k,i)=>{place(k,i);pop(k.g)});hs();
 [3,2,1,'GO!'].forEach((t,i)=>setTimeout(()=>{big(t);sfx(t=='GO!'?880:440,.3,'square',0,.09);if(t=='GO!'){ph='race';shake=.8;cam.zoom=1.12;tw(cam,{zoom:1},700,'oe');all.forEach(k=>burst(k.x,k.z,'#fff',6,8,6,.5))}hs()},i*900+400))}
function res(){const a=ks().sort((x,y)=>(x.fin||99)-(y.fin||99)||x.rk-y.rk);$('#res').innerHTML='<div>🏆 Résultats</div>'+a.map((k,i)=>`<div class="chip" style="border-color:${k.col};animation-delay:${i*.18}s">${['🥇','🥈','🥉'][i]||i+1+'.'} ${CH[k.c].e} ${nm(k)}</div>`).join('');$('#res').style.display='flex'}
function toLobby(){bots.forEach(b=>sc.remove(b.g));bots=[];HZ.forEach(h=>sc.remove(h.m));PJ.forEach(p=>sc.remove(p.m));HZ=[];PJ=[];order=tFirst=rdyT=0;ph='lobby';$('#res').style.display='none';$('#qr').style.display='block';
 for(const k of Object.values(PL)){Object.assign(k,{item:null,boost:0,spin:0,shield:0,slow:0,fin:0,auto:0,r:k.id=='kb'?0:k.r,sr:0});place(k,k.slot);pop(k.g)}all=ks();hs();sync()}
function sync(){if(!room)return;const seen={};for(const p of room.peers()){const pr=p.presence;if(!pr||!pr.role||p.isMe)continue;seen[p.peer]=1;let k=PL[p.peer];
 if(!k&&ph=='lobby'){let s=0;while(Object.values(PL).some(q=>q.slot==s))s++;if(s>7)continue;k=PL[p.peer]=newK(p.peer,s,1,pr.c|0,pr.k|0);place(k,s);conf(k.x,k.z);sfx(660,.2,'triangle',500)}if(!k)continue;
 if(ph=='lobby'){if(pr.c!==undefined&&pr.c!==k.c){k.c=pr.c;rb(k)}if(pr.k!==undefined&&pr.k!==k.k){k.k=pr.k;rb(k)}if(pr.r&&!k.r)hop(k);k.r=pr.r|0}
 k.s=+pr.s||0;if(pr.u!==k.uc){k.uc=pr.u;useItem(k)}}
 for(const id in PL)if(id!='kb'&&!seen[id]){if(ph=='lobby'){sc.remove(PL[id].g);delete PL[id]}else PL[id].auto=1}all=ks()}
(async()=>{room=await conn(CODE);const u=location.href.split('#')[0]+'#r='+CODE;$('#code').textContent=CODE.toUpperCase();
 if(room){const q=qrcode(0,'M');q.addData(u);q.make();$('#qrs').innerHTML=q.createSvgTag({cellSize:4,margin:1,scalable:true});room.onPeers(sync);hs()}else $('#qrs').innerHTML='<div style="width:170px">🚫 Room indisponible (connecte-toi à Claude)</div>'})();
/* clavier */
const KB={l:0,r:0};let kbk;
onkeydown=e=>{AC=AC||new AudioContext();AC.resume();if(e.repeat)return;const c=e.code;
 if(c=='Enter'&&ph=='lobby'){if(!kbk){let s=0;while(Object.values(PL).some(q=>q.slot==s))s++;kbk=PL.kb=newK('kb',s,1,0,1);place(kbk,s);conf(kbk.x,kbk.z);all=ks()}else start()}
 if(kbk&&ph=='lobby'){if(c=='ArrowUp'){kbk.c=(kbk.c+1)%4;rb(kbk)}if(c=='ArrowDown'){kbk.k=(kbk.k+1)%3;rb(kbk)}if(c=='Space'){kbk.r=kbk.r?0:1;kbk.r&&hop(kbk)}}
 else if(c=='Space'&&kbk)useItem(kbk);if(c=='ArrowLeft'||c=='KeyA')KB.l=1;if(c=='ArrowRight'||c=='KeyD')KB.r=1};
onkeyup=e=>{if(e.code=='ArrowLeft'||e.code=='KeyA')KB.l=0;if(e.code=='ArrowRight'||e.code=='KeyD')KB.r=0};
/* boucle */
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;stepTW(dt*1000);all=all.length?all:ks();
 if(kbk)kbk.s=KB.r-KB.l;
 if(ph=='lobby'){const h=Object.values(PL);rdyT=h.length&&h.every(k=>k.r)?rdyT+dt:0;if(rdyT>1.6)start()}
 if(ph=='race'||ph=='end'){all.forEach(k=>upd(k,dt));
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<2.8&&d>.01){const o=(2.8-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;a.sp*=.95;b.sp*=.95;if(a.bc<=0&&b.bc<=0){a.bc=b.bc=.35;sq(a,-.3);sq(b,-.3);burst((a.x+b.x)/2,(a.z+b.z)/2,'#fff',6,6,5,1);sfx(140,.08,'square',-60,.05)}}}
  for(const x of BX)if(x.on)for(const k of all)if(!k.item&&!k.fin&&(k.x-x.x)**2+(k.z-x.z)**2<5.5){x.on=0;k.item='?';burst(x.x,x.z,'#fff',14,10,10,1.6);burst(x.x,x.z,'#ffd23f',10,8,10,1.6);sfx(880,.12,'square',400);tw(x.m.scale,{x:0,y:0,z:0},150);setTimeout(()=>{x.on=1;pop(x.m)},4000);setTimeout(()=>{k.item=roll(k);ev(k,0);sfx(1200,.1,'triangle',300)},800);break}
  for(let i=HZ.length-1;i>=0;i--){const h=HZ[i];h.t+=dt;h.m.rotation.z+=dt*3;let hit=0;for(const k of all)if(!k.fin&&(h.o!==k||h.t>1)&&(k.x-h.x)**2+(k.z-h.z)**2<3.4){spinOut(k);hit=1;break}if(hit||h.t>25){burst(h.x,h.z,'#ffe03f',10);sc.remove(h.m);HZ.splice(i,1)}}
  for(let i=PJ.length-1;i>=0;i--){const p=PJ[i];p.life-=dt;let tg,bd=900;for(const k of all)if(k!==p.o&&!k.fin){const dx=k.x-p.x,dz=k.z-p.z,q=dx*dx+dz*dz;if(q<bd&&dx*Math.sin(p.h)+dz*Math.cos(p.h)>0){bd=q;tg=k}}
   const want=tg?Math.atan2(tg.x-p.x,tg.z-p.z):Math.atan2(T[p.n].x,T[p.n].z);p.h+=Math.max(-4*dt,Math.min(4*dt,wr(want-p.h)));p.x+=Math.sin(p.h)*40*dt;p.z+=Math.cos(p.h)*40*dt;p.n=near(p.x,p.z,p.n,10)[0];p.m.position.set(p.x,1,p.z);p.m.rotation.y=p.h;burst(p.x,p.z,'#ddd',1,2,2,1);
   let hit=0;for(const k of all)if(k!==p.o&&!k.fin&&(k.x-p.x)**2+(k.z-p.z)**2<4){spinOut(k);hit=1;burst(p.x,p.z,'#ff9f1c',14,12,10);break}if(hit||p.life<=0){sc.remove(p.m);PJ.splice(i,1)}}
  if(ph=='race'){const hu=all.filter(k=>k.hu);if(hu.every(k=>k.fin)||(tFirst&&tm-tFirst>18)){ph='end';all.forEach(k=>{if(!k.fin)k.auto=1});rankAll();res();hs();big('🏁');setTimeout(toLobby,9000)}}}
 all.forEach(k=>{const u=k.g.userData;k.g.position.set(k.x,k.hop+(ph=='lobby'?Math.abs(Math.sin(tm*3+k.slot))*.2:k.off&&k.sp>6?Math.sin(tm*70)*.08:0),k.z);k.g.rotation.y=k.h+k.sr;u.b.rotation.z=k.st*.2;u.b.scale.set(1-k.sq*.25,1-k.sq*.5,1+k.sq);u.c.anim&&u.c.anim(tm);u.bub.visible=k.shield>0&&(k.shield>1.5||Math.sin(tm*30)>0)});
 for(const x of BX){x.m.rotation.y+=dt*2;x.m.rotation.x+=dt;x.m.position.y=1.6+Math.sin(tm*3+x.i)*.3;x.m.material.color.setHSL((tm*.4+x.i*.1)%1,.85,.6)}
 TR.forEach((t,i)=>t.rotation.z=Math.sin(tm*1.5+i)*.04);
 for(let i=PT.length-1;i>=0;i--){const m=PT[i],d=m.userData;d.l-=dt;d.vy-=28*dt;m.position.x+=d.vx*dt;m.position.y=Math.max(.2,m.position.y+d.vy*dt);m.position.z+=d.vz*dt;m.rotation.x+=dt*6;m.scale.setScalar(Math.max(.01,Math.min(1,d.l/.35)));if(d.l<=0){sc.remove(m);PT.splice(i,1)}}
 hudT-=dt;if(hudT<0){hudT=.25;if(ph!='lobby')rankAll();chips();if(ph=='race')hs()}

 $('#big').style.opacity=BG.o;$('#big').style.transform=`scale(${BG.s})`;$('#fl').style.opacity=FL.o;R.render(sc,cam)})(last);
}
